name: Build neOmega-R2 release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6
        with:
          path: apps/neomega-viewer-r2
          persist-credentials: false
      - name: Fetch pinned build dependencies
        run: make -C apps/neomega-viewer-r2 deps
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: neomega-r2/r2/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/neomega-viewer-r2/go.mod
          cache-dependency-path: apps/neomega-viewer-r2/go.sum
      - name: Compile and package the four platforms
        working-directory: apps/neomega-viewer-r2
        run: make release VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: apps/neomega-viewer-r2/dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-packages
          path: release
      - name: Publish packages to the tagged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_MOVED: ${{ github.event.forced }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 将已有标签移到修复提交时，用本次构建替换同名下载包。
            if [[ "$TAG_MOVED" == "true" ]]; then
              gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for file in release/*; do
              if ! grep -Fxq "${file##*/}" <<<"$assets"; then
                gh release upload "$GITHUB_REF_NAME" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "neOmega-R2 $GITHUB_REF_NAME" --generate-notes
          fi
