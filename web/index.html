<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" href="data:," />
        <title>neOmega Viewer R2</title>
        <link rel="stylesheet" href="/r2/common_ui/style.css" />
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <svg class="app-symbols" aria-hidden="true">
            <symbol id="i-html" viewBox="0 0 24 24">
                <path d="M13.5 3.5h-7A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9Z" />
                <path d="M13.5 3.5V9H19m-9 3.5-2 2 2 2m4-4 2 2-2 2" />
            </symbol>
            <!-- 文件列表按来源种类区分：存档是实心方块轮廓，结构是虚线方块，其他文件是纸张。 -->
            <symbol id="i-world" viewBox="0 0 24 24">
                <path d="M12 3 19.8 7.5v9L12 21l-7.8-4.5v-9Z" /><path d="M4.2 7.5 12 12l7.8-4.5M12 12v9" />
            </symbol>
            <symbol id="i-structure" viewBox="0 0 24 24">
                <path d="M12 3 19.8 7.5v9L12 21l-7.8-4.5v-9Z" stroke-dasharray="2.2 2" /><path d="M4.2 7.5 12 12l7.8-4.5M12 12v9" />
            </symbol>
            <symbol id="i-file" viewBox="0 0 24 24">
                <path d="M13.5 3.5h-7A1.5 1.5 0 0 0 5 5v14a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V9Z" /><path d="M13.5 3.5V9H19" />
            </symbol>
            <symbol id="i-outdir" viewBox="0 0 24 24">
                <path d="M3.5 7A1.5 1.5 0 0 1 5 5.5h4.2l2 2.2H19a1.5 1.5 0 0 1 1.5 1.5v8.3A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5Z" />
                <path d="M12 10.5V16m-2.5-2.5L12 16l2.5-2.5" />
            </symbol>
        </svg>
        <template id="leading-actions">
            <button
                id="export-html"
                class="icon-button"
                title="导出离线 HTML"
                aria-label="导出离线 HTML"
                disabled
            >
                <svg><use href="#i-html" /></svg>
            </button>
            <output id="export-status" role="status" hidden></output>
            <i class="divider"></i>
        </template>
        <template id="actions">
            <button id="world-name" popovertarget="info" title="场景信息">
                <span id="world-label">未打开存档</span
                ><span id="link-state" role="img" hidden></span
                ><svg aria-hidden="true"><use href="#i-chevron" /></svg>
            </button>
            <button
                id="connect-source"
                class="icon-button"
                title="连接数据源"
                aria-label="连接数据源"
            >
                <svg><use href="#i-link" /></svg>
            </button>
            <button
                id="close-world"
                class="icon-button"
                title="关闭存档"
                aria-label="关闭存档"
                disabled
            >
                <svg><use href="#i-close-world" /></svg>
            </button>
            <i class="divider" aria-hidden="true"></i>
            <button
                id="open-world"
                class="icon-button"
                title="打开存档"
                aria-label="打开存档"
            >
                <svg><use href="#i-folder" /></svg>
            </button>
        </template>
        <template id="settings-extra"><div id="material-controls"></div></template>
        <template id="help-extra">
            <h3>坐标与存档</h3>
            <dl class="help-icons">
                <dt>
                    <svg aria-hidden="true"><use href="#i-html" /></svg
                    >导出离线 HTML
                </dt>
                <dd>
                    保存当前维度、材质、镜头与光照设置。离线打开后会从导出时的视角继续浏览。
                </dd>
                <dt>场景信息</dt>
                <dd>
                    点击场景名称可查看来源和存档路径。多维度存档还可在这里切换维度。
                </dd>
                <dt>
                    <svg aria-hidden="true"><use href="#i-link" /></svg
                    >连接数据源
                </dt>
                <dd>
                    填写 R2Link
                    地址，从游戏机器人、服务器插件或存档服务加载世界。
                </dd>
                <dt>
                    <svg aria-hidden="true">
                        <use href="#i-close-world" /></svg
                    >关闭存档
                </dt>
                <dd>
                    离开当前存档或断开外部数据源，回到内置的莫比乌斯环场景。
                </dd>
                <dt>
                    <svg aria-hidden="true"><use href="#i-folder" /></svg
                    >打开存档
                </dt>
                <dd>选择服务端上的世界目录或结构文件，在查看器中打开。</dd>
            </dl>
        </template>
        <section id="info" class="popover panel" popover>
            <h2 id="info-name">场景信息</h2>
            <p id="info-path"></p>
            <label id="world-dimension-row" class="setting" hidden
                >维度<select id="world-dimension"></select
            ></label>
            <p id="height-diagnostics" class="hint" hidden></p>
            <dl class="info-details">
                <div><dt>来源</dt><dd id="world-kind"></dd></div>
                <div id="structure-reused" hidden><dt>结构输出</dt><dd>复用已有存档</dd></div>
            </dl>
        </section>
        <dialog id="link-dialog" class="panel dialog" aria-labelledby="link-title">
            <form method="dialog" class="dialog-header">
                <h2 id="link-title">连接数据源</h2>
                <button
                    id="link-dismiss"
                    class="icon-button"
                    title="关闭连接面板"
                    aria-label="关闭连接面板"
                >
                    <svg><use href="#i-close" /></svg>
                </button>
            </form>
            <div class="dialog-body">
                <label class="field"
                    >R2Link 地址<input id="link-url" placeholder="ws://host:port/r2link"
                /></label>
                <p class="hint">
                    由游戏机器人、服务器插件或存档服务提供。连接成功后关闭当前存档。
                </p>
            </div>
            <footer class="dialog-footer">
                <output id="link-message"></output
                ><button id="link-start" class="button primary">连接</button>
            </footer>
        </dialog>
        <dialog id="files" class="panel dialog" aria-labelledby="files-title">
            <form method="dialog" class="dialog-header">
                <h2 id="files-title">打开存档或结构</h2>
                <button
                    id="picker-cancel"
                    class="icon-button"
                    title="关闭文件选择器"
                    aria-label="关闭文件选择器"
                >
                    <svg><use href="#i-close" /></svg>
                </button>
            </form>
            <div class="dialog-body">
                <div id="file-drop" hidden>
                    <strong id="file-drop-title"
                        >将存档目录或文件拖到这里打开</strong
                    >
                    <span>一次一个，松开即打开；可先调整下方打开选项</span>
                </div>
                <div class="path-row">
                    <button id="parent" class="button" title="上级目录" aria-label="上级目录">
                        <svg><use href="#i-parent" /></svg></button
                    ><input
                        id="directory"
                        placeholder="存档或目录路径"
                        aria-label="目录路径"
                    /><button id="browse" class="button">前往</button>
                </div>
                <div class="locations">
                    <div id="roots"></div>
                    <input id="file-search" type="search" aria-label="按名称筛选当前目录" placeholder="筛选" />
                </div>
                <div id="file-list"></div>
                <details id="source-options">
                    <summary><svg><use href="#i-chevron" /></svg>打开选项</summary>
                    <div class="source-fields">
                        <label class="setting"
                            >维度<select id="source-dimension"></select
                        ></label>
                        <label class="setting"
                            >Bedrock 邻接修复<input
                                id="source-fix"
                                class="switch"
                                type="checkbox"
                                checked
                        /></label>
                        <label class="setting"
                            >结构转换内存（MiB）<input
                                id="source-memory"
                                type="number"
                                min="64"
                                value="512"
                        /></label>
                        <label class="setting"
                            >结构写出并发<input
                                id="source-workers"
                                type="number"
                                min="0"
                                value="0"
                        /></label>
                    </div>
                    <div class="setting structure-root">转换输出目录<output id="structure-root"></output><button type="button" id="reset-structure-root" class="button">重置为源文件旁</button></div>
                    <p class="hint">不同来源的同名结构会直接打开已有转换结果，不覆盖。并发填 0 自动选择。</p>
                </details>
                <p id="source-hint" class="hint">选中后点「打开所选来源」。双击存档目录可浏览内部，目录右侧的图标可设置结构转换的输出目录。</p>
            </div>
            <footer class="dialog-footer">
                <output id="file-message"></output
                ><button id="open-directory" class="button primary">打开所选来源</button>
            </footer>
        </dialog>
        <script
            type="module"
            src="/r2/common_ui/boot.js"
            data-entry="/dist/app.js"
        ></script>
    </body>
</html>
