<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>neOmega Viewer R2</title>
    <link rel="stylesheet" href="/r2/common_ui/style.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <template id="actions"><button id="world-name" popovertarget="info" title="场景信息">
        <span id="world-label">未打开存档</span><span id="link-state" role="img" hidden></span></button
      ><button
        id="open-world"
        class="icon-button"
        title="打开存档"
        aria-label="打开存档"
      >
        <svg><use href="#i-folder" /></svg></button
      ><button id="connect-source" class="icon-button" title="连接数据源" aria-label="连接数据源">
        <svg><use href="#i-link" /></svg></button
      ><button
        id="close-world"
        class="icon-button"
        title="关闭存档"
        aria-label="关闭存档"
        disabled
      >
        <svg><use href="#i-close-world" /></svg></button
      ><i class="divider"></i></template>
    <template id="settings-extra">
      <h3>Java 材质包</h3>
      <input
        id="texture-path"
        aria-label="材质包路径"
        placeholder="原版，或输入 zip / 目录路径"
      />
      <div class="row">
        <button id="texture-browse">选择</button
        ><button id="texture-apply">应用</button
        ><button id="texture-reset">恢复原版</button>
      </div>
      <label class="setting"
        >贴图尺寸上限<select id="texture-size">
          <option value="16">16</option>
          <option value="32">32</option>
          <option value="64">64</option>
          <option value="128">128</option>
          <option value="256">256</option>
          <option value="512">512</option>
        </select></label
      >
      <p id="texture-status" class="hint">原版 · 支持 labPBR 法线与高光贴图</p>
    </template>
    <section id="info" class="popover panel" popover>
      <h2 id="info-name">场景信息</h2>
      <p id="info-path"></p>
      <label id="world-dimension-row" class="setting" hidden>维度<select id="world-dimension"></select></label>
      <p id="height-diagnostics" class="hint" hidden></p>
      <dl id="details"></dl>
      <p class="hint">1 个 r2region 横向覆盖 8×8 个区块（chunk）。每个区块按高度分层，每 16 层是一个 16×16×16 方块的子区块（subchunk）。</p>
    </section>
    <dialog id="link-dialog" class="panel">
      <form method="dialog" class="picker-title">
        <h2>连接数据源</h2>
        <button id="link-dismiss" class="icon-button" title="关闭连接面板" aria-label="关闭连接面板">
          <svg><use href="#i-close" /></svg>
        </button>
      </form>
      <p class="hint">游戏机器人、服务器插件或存档服务提供的 R2Link 地址。连接成功后关闭当前存档。</p>
      <label class="row">地址<input id="link-url" placeholder="ws://host:port/r2link" /></label>
      <div class="row bottom"><output id="link-message"></output><button id="link-start">连接</button></div>
    </dialog>
    <dialog id="files" class="panel">
      <form method="dialog" class="picker-title">
        <h2>打开存档或结构</h2>
        <button
          id="picker-cancel"
          class="icon-button"
          title="关闭文件选择器"
          aria-label="关闭文件选择器"
        >
          <svg><use href="#i-close" /></svg>
        </button>
      </form>
      <div id="file-drop" hidden>
        <strong id="file-drop-title">将存档目录或文件拖到这里打开</strong>
        <span>一次一个，松开即打开；可先调整下方打开选项</span>
      </div>
      <div class="row">
        <input
          id="directory"
          placeholder="存档或目录路径"
          aria-label="目录路径"
        /><button id="browse">浏览</button>
      </div>
      <div class="row locations">
        <button id="parent" title="上级目录">
          <svg><use href="#i-parent" /></svg>
        </button>
        <div id="roots"></div>
      </div>
      <div id="file-list"></div>
      <details id="source-options">
        <summary>打开选项</summary>
        <div class="source-fields">
        <label class="setting">维度<select id="source-dimension"></select></label>
        <label class="setting">Bedrock 邻接修复<input id="source-fix" type="checkbox" checked /></label>
        <label class="setting">结构转换内存（MiB）<input id="source-memory" type="number" min="64" value="512" /></label>
        <label class="setting">结构写出并发<input id="source-workers" type="number" min="0" value="0" /></label>
        </div>
        <p class="hint">并发填 0 自动选择。已有转换存档会直接复用。</p>
      </details>
      <p id="source-hint" class="hint"></p>
      <div class="row bottom">
        <output id="file-message"></output
        ><button id="open-directory">打开当前存档目录</button>
      </div>
    </dialog>
    <div id="landscape">
      <strong>仅支持横屏</strong>
      <p>请旋转设备或加宽窗口</p>
    </div>
    <script type="module" src="/r2/common_ui/boot.js" data-entry="/dist/app.js"></script>
  </body>
</html>
